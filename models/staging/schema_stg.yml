version: 2

models:
  - name: stg_orders
    description: "Pedidos padronizados para consumo analítico."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: source_customer_id
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable

      - name: order_purchase_timestamp
        data_tests:
          - not_null

  - name: stg_order_items
    description: "Itens de pedido padronizados e tipados."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: price
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.01
                max_value: 100000.00

      - name: freight_value
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000.00

  - name: stg_customers
    description: "Clientes padronizados, mantendo a chave operacional e a chave única do consumidor."
    columns:
      - name: source_customer_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null